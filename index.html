<!DOCTYPE html>
<html lang="hu"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Szúnyogvadász</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:-apple-system,system-ui,sans-serif;color:#fff;touch-action:none;-webkit-user-select:none;user-select:none}
#v,#c{position:fixed;inset:0;width:100%;height:100%}
#v{object-fit:cover}
#hud{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);display:flex;justify-content:space-between;padding:12px 18px;font-size:20px;font-weight:700;text-shadow:0 1px 4px #000;pointer-events:none}
#fire{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:92px;height:92px;border-radius:50%;border:4px solid #fff;background:rgba(220,40,40,.8);color:#fff;font-size:18px;font-weight:800;display:none}
#fire:active{background:rgba(255,90,90,.95)}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:14px}
#ov h1{margin:0;font-size:34px}
#ov p{margin:0;max-width:320px;line-height:1.4;opacity:.9}
#go{font-size:20px;font-weight:700;padding:14px 36px;border-radius:30px;border:0;background:#3ddc84;color:#04210f}
</style></head><body>
<video id="v" playsinline muted autoplay></video>
<canvas id="c"></canvas>
<div id="hud"><span>Pont: <b id="sc">0</b></span><span>Idő: <b id="tm">60</b></span></div>
<button id="fire">LŐ!</button>
<div id="ov">
<h1>🦟 Szúnyogvadász</h1>
<p id="msg">Tartsd a telefont magad elé, és fordulj körbe: a kijelzőn szúnyogok repkednek. Vidd a célkeresztet a szúnyogra, és nyomd meg a LŐ gombot (vagy koppints a képernyőre)! 60 másodperced van.</p>
<button id="go">Indítás</button>
</div>
<script>
const $=i=>document.getElementById(i);
const cv=$('c'),ctx=cv.getContext('2d'),vid=$('v');
let W,H,F,dpr;
function size(){dpr=devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);F=(H/2)/Math.tan(31*Math.PI/180)}
size();addEventListener('resize',size);

let ori={a:0,b:90,g:0},hasOri=false,fy=0,fp=0,cam=false,state='menu';
addEventListener('deviceorientation',e=>{if(e.beta==null)return;hasOri=true;ori.a=e.alpha||0;ori.b=e.beta;ori.g=e.gamma||0});

let R;
function mat(){
  const r=Math.PI/180;let a,b,g;
  if(hasOri){a=ori.a;b=ori.b;g=ori.g}else{a=-fy;b=90+fp;g=0}
  a*=r;b*=r;g*=r;
  const ca=Math.cos(a),sa=Math.sin(a),cb=Math.cos(b),sb=Math.sin(b),cg=Math.cos(g),sg=Math.sin(g);
  const m=[[ca,-sa*cb,sa*sb],[sa,ca*cb,-ca*sb],[0,sb,cb]];
  R=m.map(row=>[row[0]*cg-row[2]*sg,row[1],row[0]*sg+row[2]*cg]);
}
function proj(az,el){
  const m=[Math.cos(el)*Math.sin(az),Math.cos(el)*Math.cos(az),Math.sin(el)];
  const d=[0,1,2].map(i=>R[0][i]*m[0]+R[1][i]*m[1]+R[2][i]*m[2]);
  if(d[2]>-0.05)return null;
  return{x:W/2+d[0]/-d[2]*F,y:H/2-d[1]/-d[2]*F};
}
function viewAz(){return Math.atan2(-R[0][2],-R[1][2])}

let bugs=[],fx=[],score=0,left=60,best=0,flash=0,last=0,ac;
try{best=+localStorage.getItem('szbest')||0}catch(e){}
const rnd=(a,b)=>a+Math.random()*(b-a);
function spawn(){
  const az=viewAz()+rnd(-1.1,1.1);
  bugs.push({az,el:rnd(-0.25,0.55),vaz:rnd(-.4,.4),vel:rnd(-.2,.2),t:rnd(0,1),sc:rnd(.8,1.3),ph:rnd(0,6)});
}
function beep(f,d,type){if(!ac)return;try{const o=ac.createOscillator(),g=ac.createGain();o.type=type||'square';o.frequency.value=f;g.gain.value=.08;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.stop(ac.currentTime+d)}catch(e){}}

function shoot(){
  if(state!=='play')return;
  flash=.15;beep(180,.12);
  let bi=-1,bd=1e9;
  bugs.forEach((b,i)=>{const p=proj(b.az,b.el);if(!p)return;const d=Math.hypot(p.x-W/2,p.y-H/2);if(d<28+34*b.sc&&d<bd){bd=d;bi=i}});
  if(bi>=0){
    const b=bugs[bi],p=proj(b.az,b.el);
    for(let k=0;k<14;k++)fx.push({x:p.x,y:p.y,vx:rnd(-160,160),vy:rnd(-160,160),l:.6,c:k%2?'#b3261e':'#9acd32'});
    bugs.splice(bi,1);spawn();score+=10;$('sc').textContent=score;beep(520,.15,'sawtooth');
  }
}
$('fire').addEventListener('pointerdown',e=>{e.preventDefault();shoot()});
let drag=null;
cv.addEventListener('pointerdown',e=>{if(hasOri){shoot()}else drag={x:e.clientX,y:e.clientY}});
cv.addEventListener('pointermove',e=>{if(!drag)return;fy+=(e.clientX-drag.x)*.25;fp=Math.max(-80,Math.min(80,fp-(e.clientY-drag.y)*.25));drag={x:e.clientX,y:e.clientY}});
addEventListener('pointerup',()=>drag=null);

function drawBug(x,y,s,t,ph){
  const fl=Math.sin(t*60+ph);
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);
  ctx.strokeStyle='#111';ctx.lineWidth=1.6;
  for(const k of[-1,1])for(let j=0;j<3;j++){ctx.beginPath();ctx.moveTo(k*3,4+j*3);ctx.lineTo(k*(14+j*3),12+j*6+fl*2);ctx.stroke()}
  ctx.fillStyle='rgba(255,255,255,'+(.35+.2*Math.abs(fl))+')';
  for(const k of[-1,1]){ctx.beginPath();ctx.ellipse(k*14,-6,16,5+3*Math.abs(fl),k*(-.5+fl*.25),0,7);ctx.fill();ctx.strokeStyle='rgba(0,0,0,.5)';ctx.lineWidth=1;ctx.stroke()}
  ctx.fillStyle='#1c1c1c';
  ctx.beginPath();ctx.ellipse(0,6,5,14,0,0,7);ctx.fill();
  ctx.beginPath();ctx.arc(0,-10,5,0,7);ctx.fill();
  ctx.strokeStyle='#111';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,-14);ctx.lineTo(0,-26);ctx.stroke();
  ctx.fillStyle='#c0392b';ctx.beginPath();ctx.arc(-2,-11,1.4,0,7);ctx.arc(2,-11,1.4,0,7);ctx.fill();
  ctx.restore();
}
function cross(){
  const x=W/2,y=H/2;ctx.strokeStyle=flash>0?'#ff4d4d':'#3dff7a';ctx.lineWidth=2.5;
  ctx.beginPath();ctx.arc(x,y,30,0,7);ctx.moveTo(x-46,y);ctx.lineTo(x-14,y);ctx.moveTo(x+14,y);ctx.lineTo(x+46,y);ctx.moveTo(x,y-46);ctx.lineTo(x,y-14);ctx.moveTo(x,y+14);ctx.lineTo(x,y+46);ctx.stroke();
}
function frame(ts){
  const dt=Math.min(.05,(ts-last)/1000||0);last=ts;
  mat();
  if(cam)ctx.clearRect(0,0,W,H);else{const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1d3b57');g.addColorStop(1,'#35563a');ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
  if(state==='play'){
    left-=dt;$('tm').textContent=Math.max(0,Math.ceil(left));
    if(left<=0)end();
    for(const b of bugs){
      b.t+=dt;b.az+=b.vaz*dt;b.el+=b.vel*dt;
      if(Math.random()<dt*1.2){b.vaz=rnd(-.55,.55);b.vel=rnd(-.35,.35)}
      if(b.el>1.1)b.vel=-Math.abs(b.vel);if(b.el<-.7)b.vel=Math.abs(b.vel);
      const p=proj(b.az,b.el);if(p)drawBug(p.x,p.y,b.sc*1.1,b.t,b.ph);
    }
  }
  fx=fx.filter(f=>(f.l-=dt)>0);
  for(const f of fx){f.x+=f.vx*dt;f.y+=f.vy*dt;ctx.globalAlpha=Math.max(0,f.l/.6);ctx.fillStyle=f.c;ctx.beginPath();ctx.arc(f.x,f.y,4,0,7);ctx.fill()}
  ctx.globalAlpha=1;flash-=dt;
  if(state==='play')cross();
  requestAnimationFrame(frame);
}
function end(){
  state='over';if(score>best){best=score;try{localStorage.setItem('szbest',best)}catch(e){}}
  $('fire').style.display='none';$('ov').style.display='flex';
  $('msg').textContent='Vége! Pontszám: '+score+' · Rekord: '+best;$('go').textContent='Újra';
}
function begin(){
  score=0;left=60;bugs=[];fx=[];$('sc').textContent=0;
  for(let i=0;i<5;i++)spawn();
  state='play';$('ov').style.display='none';$('fire').style.display='block';
}
$('go').addEventListener('click',async()=>{
  if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
  if(state==='menu'){
    try{if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function')await DeviceOrientationEvent.requestPermission()}catch(e){}
    let err='';
    try{
      if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('Nincs kamera-hozzáférés ebben a nézetben');
      let s;
      try{s=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false})}
      catch(e1){s=await navigator.mediaDevices.getUserMedia({video:true,audio:false})}
      vid.srcObject=s;await vid.play();cam=true;
    }catch(e){cam=false;err=(e.name||'Hiba')+': '+(e.message||'')}
    if(!cam){
      $('msg').textContent='A kamera nem indult el ('+err+'). Nyisd meg az oldalt közvetlenül Safariban, vagy engedélyezd a kamerát. Most háttérkép nélkül indul a játék.';
      $('go').textContent='Indítás kamera nélkül';state='nocam';return;
    }
  }
  begin();
});
requestAnimationFrame(frame);
</script></body></html>
